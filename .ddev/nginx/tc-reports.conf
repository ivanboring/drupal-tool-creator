# The tool creator's HTML reports at <primary url>/tc/ (workspace/ in the repo). The same files also
# open straight from disk. Database snapshots and autosaves are not served.
location ^~ /tc/ {
    alias /var/www/html/workspace/;
    index index.html;
    autoindex on;
    default_type text/plain;
    types {
        text/html html;
        application/json json;
        image/svg+xml svg;
    }
    charset utf-8;
    location ~ /(\.cache|autosave)/ { deny all; }
}
